    {id:3012,c:"caus",p:true,s:"I had my wallet ___ while I was on the subway yesterday.",k:"나는 어제 지하철에서 지갑을 도둑맞았다.",o:["stolen","steal","to steal","stealing"],e:"목적어 my wallet이 '도둑맞은' 것이므로(수동 관계) have의 목적격보어로 과거분사 stolen을 씁니다. have는 이처럼 '(원치 않게) ~당하다'라는 뜻으로도 쓰여요."},

  var DATA = {1:L1, 2:L2, 3:L3};
  var REMEDIAL = {1:R1, 2:R2, 3:R3};
  var LEVEL_META = {
    1: {name:"초급", sub:"지각·사역·일반동사, 규칙 하나씩 다지기"},
    2: {name:"중급", sub:"학교 시험처럼 섞여 나오는 판별 문제"},
    3: {name:"고급", sub:"수동 관계·함정까지 종합 정복"}
  };
  var CAT_LABEL = {perc:"지각동사", caus:"사역동사 (get·help 포함)", gen:"일반동사 (to부정사)"};
  var TIMER_SECONDS = 25;

  function bucket(c) { return c === "perc" ? "perc" : (c === "gen" ? "gen" : "caus"); }

  /* ============ SELF-PUBLISH TEMPLATE (for the shared ranking board) ============
     TEMPLATE holds this exact page's own source text (filled in at build time by
     build_leaderboard.js). renderPageHtml() uses it to produce a brand-new complete
     document with updated ranking data, which is sent to claude.use("artifact").publish().
     Do not hand-edit the compiled file directly — edit the _source file and rebuild. */
  var TEMPLATE = "";

  // A JSON-stringified string can legally contain the closing-script-tag bytes (JS
  // does not escape forward slashes), which would prematurely end the surrounding
  // script element once embedded as page HTML (this can happen via TEMPLATE itself,
  // or via a student typing a closing script tag as their name). Break up any such
  // sequence so no HTML parser can ever see it as a real tag.
  function safeJsonForScript(value) {
    return JSON.stringify(value).replace(/<\/script/gi, "<\\/script").replace(/<!--/g, "<\\!--");
  }

  function renderPageHtml(lb) {
    // Replacement FUNCTIONS (not strings) — a plain replacement string would treat
    // "$&", "$1" etc. in the JSON specially (e.g. inside a student's typed name).
    var filled = TEMPLATE
      .replace('%%LB%%', function () { return safeJsonForScript(lb); })
      .replace('%%SELFSTR%%', function () { return safeJsonForScript(TEMPLATE); });
    return '<!doctype html><html>' + filled + '</html>';
  }

  /* ============ RANKING BOARD ============ */
  var LB_STORAGE_KEY = "g5clinic_lb_local_v1";
  var NAME_STORAGE_KEY = "g5clinic_name_v1";
  var artifactCap = null;
  var artifactReadOnly = false;
  (function initCapability() {
    try {
      if (window.claude && typeof window.claude.use === "function") {
        window.claude.use("artifact").then(function (cap) { artifactCap = cap; });
      }
    } catch (e) {}
  })();

  function getLeaderboard() {
    try {
      var el = document.getElementById("lbdata");
      var fromDoc = el ? JSON.parse(el.textContent || "[]") : [];
      if (Array.isArray(fromDoc) && fromDoc.length) return fromDoc;
    } catch (e) {}
    try {
      var raw = localStorage.getItem(LB_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function upsertLeaderboard(lb, entry) {
    var next = lb.slice();
    var idx = -1;
    for (var i = 0; i < next.length; i++) {
      if (next[i].name === entry.name && next[i].level === entry.level) { idx = i; break; }
    }
    if (idx === -1) next.push(entry);
    else if (entry.score > next[idx].score) next[idx] = entry;
    next.sort(function (a, b) {
      if (a.level !== b.level) return a.level - b.level;
      if (b.score !== a.score) return b.score - a.score;
      return a.ts - b.ts;
    });
    // keep at most 50 entries per level
    var perLevelCount = {};
    next = next.filter(function (e) {
      perLevelCount[e.level] = (perLevelCount[e.level] || 0) + 1;
      return perLevelCount[e.level] <= 50;
    });
    return next;
  }

  function recordLeaderboard(name, level, score, total) {
    var lb = getLeaderboard();
    var entry = { name: name, level: level, score: score, total: total, ts: Date.now() };
    var next = upsertLeaderboard(lb, entry);
    try { localStorage.setItem(LB_STORAGE_KEY, JSON.stringify(next)); } catch (e) {}
    var lbEl = document.getElementById("lbdata");
    if (lbEl) lbEl.textContent = JSON.stringify(next);
    if (artifactCap && !artifactReadOnly) {
      artifactCap.publish(renderPageHtml(next)).catch(function (err) {
        if (err && (err.code === "not_writer" || err.code === "not_granted")) artifactReadOnly = true;
        // "conflict" is routine — the runtime is already reloading this view to the winner.
      });
    }
    return next;
  }

  function studentName() {
    var input = document.getElementById("studentNameInput");
    if (input) return input.value.trim();
    try { return (localStorage.getItem(NAME_STORAGE_KEY) || "").trim(); } catch (e) { return ""; }
  }

  function requireName() {
    var input = document.getElementById("studentNameInput");
    if (!input || !input.value.trim()) {
      if (input) {
        input.focus();
        input.classList.add("shake");
        setTimeout(function () { input.classList.remove("shake"); }, 450);
      }
      return false;
    }
    try { localStorage.setItem(NAME_STORAGE_KEY, input.value.trim()); } catch (e) {}
    /* 결과 보내기 칸에도 같은 이름이 미리 적히도록 함께 저장합니다. */
    try { localStorage.setItem("kkt_name_v1", input.value.trim()); } catch (e) {}
    return true;
  }

  function boardHtml() {
    var lb = getLeaderboard();
    var me = studentName();
    var html = '<div class="board-card"><div class="board-title">🏆 도전 랭킹</div>' +
      '<p class="board-sub">이름을 입력하고 각 단계에 도전하면 점수가 여기 함께 쌓여요 (단계별 최고 점수 기준).</p>' +
      '<div class="board-grid">';
    [1, 2, 3].forEach(function (lv) {
      var rows = lb.filter(function (e) { return e.level === lv; }).slice(0, 5);
      html += '<div class="board-col"><h4>' + LEVEL_META[lv].name + '</h4>';
      if (!rows.length) {
        html += '<p class="board-empty">아직 도전자가 없어요</p>';
      } else {
        html += '<ul class="board-list">';
        rows.forEach(function (r, i) {
          html += '<li class="board-row' + (r.name === me ? ' me' : '') + '"><span class="board-rank">' + (i + 1) + '</span><span class="board-name">' + escapeHtml(r.name) + '</span><span class="board-score">' + r.score + '/' + r.total + '</span></li>';
        });
        html += '</ul>';
      }
      html += '</div>';
    });
    html += '</div>' + (artifactCap ? '' : '<p class="board-note">이 링크가 실제로 발행된 페이지에서 열려 있어야 랭킹이 모든 학생에게 공유돼요. 지금 이 화면(로컬 미리보기)에서는 이 브라우저에만 기록됩니다.</p>') + '</div>';
    return html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ============ STATE ============ */
  var STORAGE_KEY = "g5clinic_v1";
  function defaultState() {
    return { levels: { 1:{unlocked:true,passed:false,best:0}, 2:{unlocked:false,passed:false,best:0}, 3:{unlocked:false,passed:false,best:0} }, progress: null };
  }
  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var s = JSON.parse(raw);
      if (!s || !s.levels) return defaultState();
      return s;
    } catch (e) { return defaultState(); }
  }
  var state = loadState();
  function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }

  /* ============ HELPERS ============ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildAttempt(list) {
    return shuffle(list).map(function (q) {
      var order = shuffle([0, 1, 2, 3]);
      var opts = order.map(function (i) { return q.o[i]; });
      var correctIdx = order.indexOf(0);
      return { id: q.id, c: q.c, p: !!q.p, s: q.s, k: q.k, opts: opts, correctIdx: correctIdx, e: q.e };
    });
  }

  var app = document.getElementById("app");

  /* ============ HOME SCREEN ============ */
  var selectedMode = "normal";

  function renderHome() {
    var html = "";
    var savedName = "";
    try { savedName = localStorage.getItem(NAME_STORAGE_KEY) || ""; } catch (e) {}

    html += '<div class="student-card"><span class="student-label">학생 이름</span>' +
      '<input type="text" id="studentNameInput" class="student-input" placeholder="이름을 입력하세요" autocomplete="off" value="' + escapeHtml(savedName) + '" />' +
      '<span class="student-hint">이름을 적으면 결과를 선생님께 보낼 수 있어요</span></div>';

    html += '<div class="mode-card"><span class="mode-label">모드 선택</span><div class="mode-opts">' +
      '<label class="mode-opt' + (selectedMode==="normal"?" picked":"") + '"><input type="radio" name="mode" value="normal"' + (selectedMode==="normal"?" checked":"") + '> 일반 모드 (시간제한 없음)</label>' +
      '<label class="mode-opt' + (selectedMode==="timer"?" picked":"") + '"><input type="radio" name="mode" value="timer"' + (selectedMode==="timer"?" checked":"") + '> 타이머 모드 (문항당 ' + TIMER_SECONDS + '초)</label>' +
      '</div></div>';

    html += '<div class="level-grid">';
    [1, 2, 3].forEach(function (lv) {
      var st = state.levels[lv];
      var meta = LEVEL_META[lv];
      var inProgress = state.progress && state.progress.level === lv;
      var statusHtml = "";
      if (st.passed) statusHtml = '<span class="lv-status passed">통과 · 최고 ' + st.best + '/25</span>';
      else if (inProgress) statusHtml = '<span class="lv-status progress">이어풀기 가능 (' + (state.progress.phase === "remedial" ? "복습 중" : "진행 중") + ')</span>';
      else statusHtml = '<span class="lv-status progress">시작 전</span>';

      var btnHtml = "";
      if (inProgress) {
        btnHtml = '<button class="btn small" data-action="resume">이어풀기</button>';
      } else {
        btnHtml = '<button class="btn small" data-action="start" data-level="' + lv + '">' + (st.passed ? "다시 풀기" : "시작하기") + '</button>';
      }

      html += '<div class="level-card">' +
        '<div class="lv-left"><div class="lv-num">' + lv + '</div><div><p class="lv-name">' + meta.name + '</p><p class="lv-sub">' + meta.sub + '</p>' + statusHtml + '</div></div>' +
        '<div>' + btnHtml + '</div></div>';
    });
    html += '</div>';

    html += '<p class="board-note" style="text-align:center;border:none;padding-top:0;margin:2px 0 22px;">단계는 순서와 상관없이 원하는 대로 골라 도전할 수 있어요.</p>';


    app.innerHTML = html;

    app.querySelectorAll('input[name="mode"]').forEach(function (r) {
      r.addEventListener("change", function () { selectedMode = r.value; renderHome(); });
    });
    app.querySelectorAll('[data-action="start"]').forEach(function (b) {
      b.addEventListener("click", function () {
        if (!requireName()) return;
        var lv = Number(b.dataset.level);
        startAttempt(lv, "main", selectedMode);
      });
    });
    var resumeBtn = app.querySelector('[data-action="resume"]');
    if (resumeBtn) {
      resumeBtn.addEventListener("click", function () {
        if (!requireName()) return;
        renderQuiz();
      });
    }
  }

  /* ============ QUIZ FLOW ============ */
  function startAttempt(level, phase, mode) {
    var pool = phase === "main" ? DATA[level] : pickRemedial(level);
    state.progress = {
      level: level, mode: mode, phase: phase,
      questions: buildAttempt(pool),
      idx: 0, correct: 0,
      answered: []
    };
    save();
    renderQuiz();
  }

  function pickRemedial(level) {
    var bank = REMEDIAL[level];
    var wrongCats = (state.progress && state.progress.wrongCats) || null;
    if (!wrongCats || !wrongCats.length) return bank;
    var filtered = bank.filter(function (q) { return wrongCats.indexOf(bucket(q.c)) !== -1; });
    return filtered.length ? filtered : bank;
  }

  var timerHandle = null;

  function renderQuiz() {
    clearTimer();
    var p = state.progress;
    var total = p.questions.length;
    var q = p.questions[p.idx];
    var levelName = LEVEL_META[p.level].name;
    var phaseLabel = p.phase === "remedial" ? "복습" : levelName;

    var html = "";
    html += '<div class="status-bar"><span class="round-pill">' + phaseLabel + ' · ' + (p.idx + 1) + '/' + total + '</span>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + Math.round((p.idx / total) * 100) + '%"></div></div>' +
      '<span class="score-tag">정답 ' + p.correct + ' · 오답 ' + (p.idx - p.correct) + '</span></div>';

    if (p.mode === "timer") {
      html += '<div class="timer-wrap"><div class="timer-track"><div class="timer-fill" id="timerFill" style="width:100%"></div></div></div>';
    }

    html += '<div class="q-card" id="qCard" data-state="pending">' +
      '<div class="q-head"><span class="q-num">Q' + (p.idx + 1) + '</span></div>' +
      '<div class="q-sentence">' + q.s + '</div>' +
      '<div class="q-kr">' + q.k + '</div>' +
      '<div class="mc-options" id="mcOptions"></div>' +
      '<div class="feedback hidden" id="feedback"></div>' +
      '<div class="btn-row hidden" id="nextRow"><button class="btn" id="nextBtn">다음 문제</button></div>' +
      '</div>';

    app.innerHTML = html;

    var optWrap = document.getElementById("mcOptions");
    q.opts.forEach(function (opt, idx) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "mc-opt";
      b.innerHTML = '<span class="mc-idx">' + String.fromCharCode(9312 + idx) + '</span><span>' + opt + '</span>';
      b.addEventListener("click", function () { gradeAnswer(idx); });
      optWrap.appendChild(b);
    });

    if (p.mode === "timer") startTimer();
  }

  function startTimer() {
    var fill = document.getElementById("timerFill");
    if (!fill) return;
    var remaining = TIMER_SECONDS * 10;
    var total = remaining;
    timerHandle = setInterval(function () {
      remaining -= 1;
      var pct = Math.max(0, (remaining / total) * 100);
      fill.style.width = pct + "%";
      if (pct < 30) fill.classList.add("low");
      if (remaining <= 0) {
        clearTimer();
        gradeAnswer(-1);
      }
    }, 100);
  }
  function clearTimer() { if (timerHandle) { clearInterval(timerHandle); timerHandle = null; } }

  function gradeAnswer(pickedIdx) {
    clearTimer();
    var p = state.progress;
    var q = p.questions[p.idx];
    var card = document.getElementById("qCard");
    if (card.dataset.state !== "pending") return;

    var isCorrect = pickedIdx === q.correctIdx;
    card.dataset.state = isCorrect ? "correct" : "incorrect";

    var opts = document.querySelectorAll("#mcOptions .mc-opt");
    opts.forEach(function (el, idx) {
      el.disabled = true;
      if (idx === q.correctIdx) el.classList.add("mc-correct");
      else if (idx === pickedIdx) el.classList.add("mc-wrong");
    });

    var fb = document.getElementById("feedback");
    fb.classList.remove("hidden");
    fb.className = "feedback " + (isCorrect ? "correct" : "incorrect");
    var mark = isCorrect ? '<span class="mark">✔ 정답</span>' : '<span class="mark">✘ 오답</span>';
    fb.innerHTML = '<div class="fb-top">' + mark + '</div><p class="fb-expl"><span class="expl-label">해설</span>' + q.e + '</p>';

    document.getElementById("nextRow").classList.remove("hidden");

    if (isCorrect) p.correct += 1;
    p.answered.push({ id: q.id, c: q.c, p: q.p, correct: isCorrect });
    save();

    document.getElementById("nextBtn").addEventListener("click", function () {
      p.idx += 1;
      save();
      if (p.idx >= p.questions.length) finishAttempt();
      else renderQuiz();
    });
  }

  /* ============ RESULT ============ */
  function finishAttempt() {
    var p = state.progress;
    var total = p.questions.length;
    var scorePct = Math.round((p.correct / total) * 100);
    var wrongCats = [];
    p.answered.forEach(function (a) { if (!a.correct && wrongCats.indexOf(bucket(a.c)) === -1) wrongCats.push(bucket(a.c)); });

    if (p.phase === "remedial") {
      renderRemedialDone();
      return;
    }

    var pass = scorePct >= 80;
    var st = state.levels[p.level];
    var name = studentName();
    if (name) recordLeaderboard(name, p.level, p.correct, total);

    if (pass) {
      st.passed = true;
      st.best = Math.max(st.best, p.correct);
      state.progress = null;
      save();
      renderResult(p, total, scorePct, pass, null);
    } else {
      st.best = Math.max(st.best, p.correct);
      p.wrongCats = wrongCats;
      p.stage = "await_remedial";
      save();
      renderResult(p, total, scorePct, pass, wrongCats);
    }
  }

  function catStats(answered) {
    var stats = { perc: { c: 0, w: 0 }, caus: { c: 0, w: 0 }, gen: { c: 0, w: 0 } };
    var passive = { c: 0, w: 0, any: false };
    answered.forEach(function (a) {
      var b = bucket(a.c);
      stats[b].c += 1;
      if (!a.correct) stats[b].w += 1;
      if (a.p) {
        passive.any = true;
        passive.c += 1;
        if (!a.correct) passive.w += 1;
      }
    });
    return { stats: stats, passive: passive };
  }

  function diagHtml(answered) {
    var r = catStats(answered);
    var html = '<div class="diag-grid">';
    ["perc", "caus", "gen"].forEach(function (b) {
      var s = r.stats[b];
      if (s.c === 0) return;
      var right = s.c - s.w;
      var pct = Math.round((right / s.c) * 100);
      html += '<div class="diag-tile"><div class="dt-label">' + CAT_LABEL[b] + '</div>' +
        '<div class="diag-track"><div class="diag-fill' + (pct < 70 ? " warn" : "") + '" style="width:' + pct + '%"></div></div>' +
        '<div class="dt-val">' + right + ' / ' + s.c + ' 정답 (' + pct + '%)</div></div>';
    });
    if (r.passive.any) {
      var pr = r.passive.c - r.passive.w;
      var ppct = Math.round((pr / r.passive.c) * 100);
      html += '<div class="diag-tile"><div class="dt-label">수동 관계 (p.p.) 함정</div>' +
        '<div class="diag-track"><div class="diag-fill' + (ppct < 70 ? " warn" : "") + '" style="width:' + ppct + '%"></div></div>' +
        '<div class="dt-val">' + pr + ' / ' + r.passive.c + ' 정답 (' + ppct + '%)</div></div>';
    }
    html += '</div>';
    return html;
  }

  function wrongListHtml(p) {
    var wrongIds = p.answered.filter(function (a) { return !a.correct; }).map(function (a) { return a.id; });
    if (!wrongIds.length) return "";
    var html = '<div class="final-list">';
    wrongIds.forEach(function (id) {
      var q = p.questions.filter(function (x) { return x.id === id; })[0];
      var answerText = q.opts[q.correctIdx];
      html += '<div class="final-item"><span class="fs">' + q.s.replace("___", "____") + '</span>' +
        '<p class="fi-kr">' + q.k + '</p>' +
        '<p class="fi-ans">정답: ' + answerText + '</p>' +
        '<p class="fi-expl">' + q.e + '</p></div>';
    });
    html += '</div>';
    return html;
  }

  function renderResult(p, total, scorePct, pass, wrongCats) {
    clearTimer();
    var html = "";
    html += '<div class="banner"><span class="badge ' + (pass ? "pass" : "fail") + '">' + (pass ? "통과" : "80점 미만") + '</span>' +
      '<div class="big' + (pass ? "" : " fail") + '"><span class="num-correct">' + p.correct + '</span> / ' + total + ' (' + scorePct + '점)</div>' +
      '<p class="desc">' + (pass
        ? (p.level < 3 ? LEVEL_META[p.level].name + " 단계를 통과했어요! 이어서 " + LEVEL_META[p.level + 1].name + " 단계에 도전해보세요." : "고급 단계까지 통과했어요! 정말 훌륭합니다.")
        : "80점(20/25)에는 닿지 못했어요. 틀린 유형과 같은 문제로 먼저 복습한 뒤 다시 도전해보세요.") + '</p>' +
      diagHtml(p.answered) +
      (pass ? '<button class="btn" id="homeBtn" style="margin-top:6px;">' + (p.level < 3 ? "다음 단계 보러 가기" : "처음으로") + '</button>'
            : '<button class="btn" id="remedialBtn" style="margin-top:6px;">오답 유형 복습하기</button>') +
      '</div>';
    if (!pass) html += wrongListHtml(p);
    app.innerHTML = html;

    var homeBtn = document.getElementById("homeBtn");
    if (homeBtn) homeBtn.addEventListener("click", function () { renderHome(); });
    var remBtn = document.getElementById("remedialBtn");
    if (remBtn) remBtn.addEventListener("click", function () {
      startAttempt(p.level, "remedial", p.mode);
    });
  }

  function renderRemedialDone() {
    var p = state.progress;
    var html = '<div class="banner"><span class="badge pass">복습 완료</span>' +
      '<div class="big"><span class="num-correct">' + p.correct + '</span> / ' + p.questions.length + '</div>' +
      '<p class="desc">약했던 유형을 다시 짚어봤어요. 이제 ' + LEVEL_META[p.level].name + ' 단계 25문제에 새로 도전해보세요.</p>' +
      '<button class="btn" id="retryBtn" style="margin-top:6px;">' + LEVEL_META[p.level].name + ' 다시 도전하기</button>' +
      '</div>';
    app.innerHTML = html;
    document.getElementById("retryBtn").addEventListener("click", function () {
      startAttempt(p.level, "main", p.mode);
    });
  }

  /* ============ INIT ============ */
  renderHome();
})();
</script>
<script>
/* 문제를 푸는 동안에는 첫 화면 소개글을 감춥니다 (다른 게임과 같은 틀). */
(function () {
  var app = document.getElementById("app");
  var sub = document.getElementById("introSub");
  if (!app || !sub) return;
  function sync() {
    var home = !!app.querySelector('input[name="mode"]');
    sub.style.display = home ? "" : "none";
  }
  new MutationObserver(sync).observe(app, { childList: true, subtree: true });
  sync();
})();
</script>
<script src="/kkt.js"></script>
</html>
